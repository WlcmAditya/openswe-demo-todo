<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo Management</title>
</head>
<body>

<h1>Todo Management</h1>

<form th:action="@{/todos}"
      th:object="${todo}"
      method="post">

    <div>
        <label>Title</label>
        <input type="text"
               th:field="*{title}">
    </div>

    <br>

    <div>
        <label>Description</label>

        <textarea
                th:field="*{description}">
        </textarea>
    </div>

    <br>

    <button type="submit">
        Save Todo
    </button>

</form>

<hr>

<h2>Todo List</h2>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Completed</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="todo : ${todos}">

        <td th:text="${todo.id}"></td>

        <td th:text="${todo.title}"></td>

        <td th:text="${todo.description}"></td>

        <td th:text="${todo.completed}"></td>

    </tr>

    </tbody>

</table>

</body>
</html>
